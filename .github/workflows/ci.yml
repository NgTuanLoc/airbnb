name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run seed:check
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: |
          dotnet test --project tests/Airbnb.UnitTests
          dotnet test --project tests/Airbnb.ArchitectureTests
          dotnet test --project tests/Airbnb.Api.Tests

  # The notification service is its own solution with its own tests (Postgres, LavinMQ and Mailpit containers).
  notifications:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notifications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --project tests/Airbnb.Notifications.Tests

  payments:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --project tests/Airbnb.Payments.Tests

  chat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --project tests/Airbnb.Chat.Tests

  apphost:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
        working-directory: frontend
      # Aspire runs the photo-processor Azure Function with the Core Tools' `func` host.
      - run: npm i -g azure-functions-core-tools@4 --unsafe-perm true
      - run: dotnet test --project tests/Airbnb.AppHost.Tests
